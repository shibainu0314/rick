<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>おめでとう</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    body {
      background-color: #0f172a;
      color: #f8fafc;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      text-align: center;
      overflow: hidden;
    }
    /* 罠（Bait）画面 */
    .bait-card {
      background: #1e293b;
      padding: 2.5rem;
      border-radius: 1rem;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
      max-width: 420px;
      width: 90%;
      border: 1px solid #334155;
    }
    .badge {
      display: inline-block;
      background-color: #ef4444;
      color: #fff;
      font-size: 0.75rem;
      font-weight: bold;
      padding: 0.25rem 0.75rem;
      border-radius: 9999px;
      margin-bottom: 1rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    h1 {
      font-size: 1.5rem;
      margin-bottom: 1rem;
      line-height: 1.4;
    }
    p {
      color: #94a3b8;
      font-size: 0.95rem;
      margin-bottom: 2rem;
      line-height: 1.6;
    }
    .btn {
      display: block;
      width: 100%;
      background: linear-gradient(135deg, #3b82f6, #2563eb);
      color: #ffffff;
      padding: 1rem;
      border-radius: 0.5rem;
      font-size: 1.1rem;
      font-weight: bold;
      border: none;
      cursor: pointer;
      transition: transform 0.1s ease, background 0.2s ease;
      box-shadow: 0 4px 6px -1px rgba(37, 99, 235, 0.4);
    }
    .btn:hover {
      background: linear-gradient(135deg, #2563eb, #1d4ed8);
      transform: translateY(-2px);
    }
    .btn:active {
      transform: translateY(0);
    }

    /* リックロール全画面プレイヤー */
    #rickroll-container {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background-color: #000;
      z-index: 9999;
    }
    iframe {
      width: 100%;
      height: 100%;
      border: none;
    }
  </style>
</head>
<body>

  <!-- フェイクの誘導カード -->
  <div class="bait-card" id="bait">
    <span class="badge">おめでとう</span>
    <h1>この動画を見ると幸せになれます。</h1>
    <p>以下のボタンをクリックして、動画にアクセスしてください。</p>
    <button class="btn" onclick="startRickroll()">動画を表示する</button>
  </div>

  <!-- リックロール動画プレイヤー -->
  <div id="rickroll-container">
    <iframe 
      id="rickroll-video" 
      src="" 
      allow="autoplay; encrypted-media" 
      allowfullscreen>
    </iframe>
  </div>

  <script>
    function startRickroll() {
      // 誘導カードを非表示にする
      document.getElementById('bait').style.display = 'none';

      // 動画コンテナを表示
      const container = document.getElementById('rickroll-container');
      container.style.display = 'block';

      // YouTube公式のRickroll動画（自動再生・コントロール有効）を読み込む
      const video = document.getElementById('rickroll-video');
      video.src = "https://www.youtube.com/embed/dQw4w9WgXcQ?autoplay=1&controls=1";
    }
  </script>
</body>
</html>
